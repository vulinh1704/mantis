name: diag-lcp

# TEMPORARY (removed before merge): how often does a CI runner see no LCP entry for slow-app's
# hero on desktop, and what does Chrome report instead?
on:
  pull_request:

permissions:
  contents: read

jobs:
  lcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 15 desktop visits of slow-app, one at a time
        run: |
          node test/helpers/slow-server.js 4336 &
          sleep 1
          for i in $(seq 1 15); do
            node bin/mantis.js perf http://127.0.0.1:4336/ --runs 1 --profile desktop --baseline none --out "/tmp/diag/$i" > /dev/null 2>&1 || true
          done
          node -e '
            const fs = require("fs");
            for (const d of fs.readdirSync("/tmp/diag")) {
              const v = JSON.parse(fs.readFileSync(`/tmp/diag/${d}/perf/latest/perf.json`, "utf8")).routes[0].visit;
              const hero = v.requests.find((q) => /hero/.test(q.url));
              const img = v.images.find((i) => /hero/.test(i.src));
              console.log(d, v.lcpElement?.selector, "lcp", v.lcp, "fcp", v.fcp, "candidates", JSON.stringify(v.lcpCandidates), "hero", hero?.start, hero?.end, "img", JSON.stringify(img?.rendered), img?.natural?.width, "shifts", JSON.stringify(v.shifts.map((s) => [s.t, +s.value.toFixed(3), s.cause?.kind])));
            }'
          npx playwright --version
