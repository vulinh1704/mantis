name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
        env:
          MANTIS_KEEP_TEST_OUTPUT: '1'

      - name: Upload Mantis output from the fixture runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-test-output-node${{ matrix.node }}
          path: /tmp/mantis-test-*
          if-no-files-found: ignore
          retention-days: 7
