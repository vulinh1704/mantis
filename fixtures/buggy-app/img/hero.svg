  <line x1="316" y1="540" x2="786" y2="540" stroke="#f1f5f9" stroke-width="2"/>
  <path d="M316 500 C356 488 376 452 416 456 S476 492 516 470 S576 398 616 404 S676 436 716 386 S766 330 786 322 L786 570 L316 570 Z" fill="url(#area)"/>
