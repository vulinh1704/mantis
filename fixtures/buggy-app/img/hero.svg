  <rect x="94" y="130" width="28" height="28" rx="8" fill="#6366f1"/>
  <rect x="132" y="137" width="80" height="14" rx="7" fill="#c7d2fe"/>
  <rect x="94" y="190" width="142" height="34" rx="10" fill="#eef2ff"/>
  <rect x="108" y="201" width="90" height="12" rx="6" fill="#6366f1"/>
  <rect x="108" y="246" width="100" height="12" rx="6" fill="#cbd5e1"/>
