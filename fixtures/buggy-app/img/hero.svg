  <rect x="108" y="366" width="70" height="12" rx="6" fill="#cbd5e1"/>

  <!-- KPI cards -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="290" y="130" width="250" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="312" y="164" font-size="15" fill="#64748b">Visitors</text>
    <text x="312" y="208" font-size="34" font-weight="700" fill="#0f172a">48.2k</text>
    <rect x="448" y="186" width="70" height="26" rx="13" fill="#dcfce7"/>
    <text x="462" y="204" font-size="14" font-weight="700" fill="#15803d">+12%</text>

    <rect x="560" y="130" width="250" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="582" y="164" font-size="15" fill="#64748b">Conversion</text>
    <text x="582" y="208" font-size="34" font-weight="700" fill="#0f172a">4.8%</text>
    <rect x="718" y="186" width="70" height="26" rx="13" fill="#dcfce7"/>
    <text x="733" y="204" font-size="14" font-weight="700" fill="#15803d">+0.6</text>

    <rect x="830" y="130" width="270" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="852" y="164" font-size="15" fill="#64748b">Avg. visit</text>
